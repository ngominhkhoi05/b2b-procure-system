spring:
  application:
    name: b2b-procure-system

  profiles:
    active: dev

  servlet:
    multipart:
      # Cap individual file at 6 MB so multipart parsing itself never OOMs.
      # CloudinaryStorageService enforces a tighter app-level limit
      # (app.cloudinary.max-bytes, default 5 MB) on top of this.
      max-file-size: 6MB
      max-request-size: 6MB
      file-size-threshold: 1MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder-google-client-secret}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email

app:
  oauth2:
    authorized-redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/redirect}
  cors:
    # Allowed origins. Supports two binding modes:
    #   1. YAML list (preferred in dev):
    #        allowed-origins:
    #          - http://localhost:3000
    #          - http://localhost:5173
    #   2. Comma-separated env var (preferred in prod):
    #        CORS_ALLOWED_ORIGINS=https://app.example.com,https://www.example.com
    # Empty list = no CORS. NEVER use "*" with allowCredentials=true.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    exposed-headers: Authorization,Content-Type,X-Requested-With
    allow-credentials: true
    max-age: 3600

  # Cloudinary — generic image storage for user avatars, covers, product imagery.
  # Backend never stores binary, only these URLs (see AGENTS.md Rule 9).
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key:    ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}
    # Logical root folder under the cloud. Per-profile YAML can override
    # to e.g. "b2b-procure/dev" so dev uploads don't pollute prod.
    folder:     ${CLOUDINARY_FOLDER:b2b-procure}
    # App-level hard cap. Keep <= spring.servlet.multipart.max-file-size.
    max-bytes:  5242880

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expirationMs: 86400000
  header: Authorization
  prefix: "Bearer "

zalopay:
  app-id: ${ZALOPAY_APP_ID:2553}
  key1: ${ZALOPAY_KEY1:PcY4iZIKFCIdgZvA6ueMcMHHUbRLYjPL}
  key2: ${ZALOPAY_KEY2:kLtgPl8HHhfvMuDHPwKfgfsY4Ydm9eIz}
  endpoint: ${ZALOPAY_ENDPOINT:https://sb-openapi.zalopay.vn/v2/create}
  query-endpoint: ${ZALOPAY_QUERY_ENDPOINT:https://sb-openapi.zalopay.vn/v2/query}
  refund-endpoint: ${ZALOPAY_REFUND_ENDPOINT:https://sb-openapi.zalopay.vn/v2/refund}
  callback-url: ${ZALOPAY_CALLBACK_URL:https://panther-flatness-unzip.ngrok-free.dev/api/v1/payments/zalopay/callback}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  file:
    name: app.log