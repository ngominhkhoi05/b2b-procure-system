spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/b2b
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

# CORS override for dev profile: allow Vite (5173), Create React App (3000), and Swagger tools.
app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
      - http://127.0.0.1:3000
      - http://127.0.0.1:5173

logging:
  file:
    name: app.log
  level:
    root: INFO
    com.b2bprocure.system: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG