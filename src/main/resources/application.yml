spring:
  application:
    name: b2b-procure-system

  profiles:
    active: dev

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expirationMs: 86400000
  header: Authorization
  prefix: "Bearer "

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha