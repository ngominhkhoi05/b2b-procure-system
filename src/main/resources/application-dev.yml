spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/b2b
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

logging:
  file:
    name: app.log
  level:
    root: INFO
    com.b2bprocure.system: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG