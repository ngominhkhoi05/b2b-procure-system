spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

# Spring Boot Actuator — only expose health & info for the container
# healthcheck. Details are hidden when unauthorized so this does not
# expose sensitive component data to anonymous callers.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

jwt:
  secret: ${JWT_SECRET}

# CORS in production: must be set via env var CORS_ALLOWED_ORIGINS.
# Example: CORS_ALLOWED_ORIGINS=https://app.example.com,https://www.example.com
# Empty by default = no cross-origin access allowed (browser will block).
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  cloudinary:
    # Production folder. Never share with dev.
    folder: ${CLOUDINARY_FOLDER:b2b-procure/prod}

logging:
  level:
    root: INFO
    com.b2bprocure.system: INFO